name: CI

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline tests
        run: python -m unittest -v tests/test_offline.py
      - name: Check shell syntax
        shell: bash
        run: |
          bash -n install.sh bin/esp32-agent esp-agent.sh scripts/setup.sh
          bash -n agentic/esp-session-start.sh agentic/esp-session-stop.sh agentic/idf_build.sh
          bash -n tests/test-full-toolchain.sh
